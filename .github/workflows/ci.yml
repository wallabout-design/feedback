name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The installed Playwright version, which names the container image below, so
  # the two can never drift apart when Dependabot updates Playwright.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  test:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image: the browsers and their system libraries are in it.
    # Installing them on each run (`playwright install --with-deps`) downloads
    # from Ubuntu's mirror, and when that stalled, jobs hung until they timed
    # out (4 of 10 burn-in runs on 2026-11-10). Tests must not need the network.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Everything: type check, build, unit tests, browser tests. The same
      # command as on a laptop (standards/testing.md in wallabout-design/standards).
      # The scans run in the `scan` job, which has the tools; SKIP_SCANS stops `verify` running them here too.
      - run: npm run verify
        env:
          SKIP_SCANS: '1'
      # Sites install dist/ straight from git, so it must match src/.
      - name: dist/ is up to date
        if: always()
        # In the container the checkout belongs to another user, so git needs
        # telling that the directory is safe.
        run: git -c safe.directory="$GITHUB_WORKSPACE" diff --exit-code -- dist || (echo "Run npm run build and commit dist/." && exit 1)
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Secrets and known-vulnerable dependencies (standards/security.md, "scans on every
  # PR"). Required check. The tools are release binaries with pinned SHA-256s
  # (scripts/ci-install-scan-tools.sh); `gitleaks-action` needs a paid licence.
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Full history: gitleaks reads the commits between origin/main and this branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bash scripts/ci-install-scan-tools.sh gitleaks osv-scanner
      # A push to main has already passed on its pull request, and has no commits
      # beyond origin/main to scan.
      - if: github.event_name == 'pull_request'
        run: npm run scan:secrets
      - run: npm run scan:deps
